# main branchga har push qilinganda frontend yig'iladi va GitHub Pages'ga joylanadi.
# Sozlamalar: repo → Settings → Secrets and variables → Actions → Variables:
#   VITE_API_URL       — Apps Script Web App manzili (.../exec)
#   VITE_BOT_USERNAME  — masalan @epcoaksiya_bot
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME }}
          VITE_DEMO: 'false'

      # /verify/... kabi to'g'ridan-to'g'ri havolalar ham ilovani ochishi uchun
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
