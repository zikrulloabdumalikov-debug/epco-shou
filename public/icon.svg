<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06154A"/>
      <stop offset="100%" stop-color="#0D2F8F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="40%" stop-color="#FFC933"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Halo -->
  <circle cx="256" cy="280" r="140" fill="url(#goldGrad)" opacity="0.2" filter="url(#glow)"/>

  <!-- Oil Drop Shape -->
  <path d="M 256 80 C 256 80 140 230 140 320 C 140 386.27 191.96 440 256 440 C 320.04 440 372 386.27 372 320 C 372 230 256 80 256 80 Z" fill="url(#goldGrad)" />
  
  <!-- Drop Inner Highlight -->
  <path d="M 230 140 C 230 140 170 240 170 310 C 170 330 178 350 190 365 C 182 345 182 320 195 285 C 210 245 235 200 245 170 Z" fill="#FFFFFF" opacity="0.45" />

  <!-- Star Sparkle 1 -->
  <path d="M 360 140 Q 375 140 375 125 Q 375 140 390 140 Q 375 140 375 155 Q 375 140 360 140 Z" fill="#FFF275"/>
  <!-- Star Sparkle 2 -->
  <path d="M 120 220 Q 135 220 135 205 Q 135 220 150 220 Q 135 220 135 235 Q 135 220 120 220 Z" fill="#FFF275"/>

  <!-- Text EPCO -->
  <text x="256" y="340" font-family="'Rubik', Arial, sans-serif" font-weight="900" font-size="52" fill="#06154A" text-anchor="middle" letter-spacing="2">EPCO</text>
  <text x="256" y="375" font-family="'Rubik', Arial, sans-serif" font-weight="700" font-size="20" fill="#06154A" text-anchor="middle" letter-spacing="4">SHOU</text>
</svg>
